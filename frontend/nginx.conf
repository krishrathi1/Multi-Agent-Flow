server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Use relative redirects so Docker port mapping works
    absolute_redirect off;

    # Content Security Policy — allow Vision AI tracker and Google Fonts
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://vision.blostem.com https://static.cloudflareinsights.com; connect-src 'self' https://vision.blostem.com wss://nexus.blostem.com ws://nexus.blostem.com https://cloudflareinsights.com; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self'; media-src 'self' blob:; worker-src 'self' blob:;" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Cache static assets (JS/CSS with content hashes)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SEO files — short cache so updates propagate quickly
    location = /robots.txt {
        expires 1d;
        add_header Cache-Control "public";
    }

    location = /sitemap.xml {
        expires 1d;
        add_header Cache-Control "public";
    }

    # Protected app routes — tell search engines not to index
    location ~ ^/(dashboard|agents|chat|gateways|boards|approvals|activity|comms|timeline|topology|controls|metrics|alerts|search|tasks|settings|skills|soul-templates|custom-fields|invitations)(/|$) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }

    # API proxy to backend (resolver allows runtime DNS so nginx starts even if backend is slow)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:4000;

    location /api/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket proxy for Socket.io
    location /socket.io/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # SPA fallback — serve index.html for all other routes
    # Pre-rendered pages will be served as static files via try_files $uri/
    location / {
        try_files $uri $uri/ /index.html;
    }
}
