services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nexus
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_BIND_HOST}:${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_BIND_HOST}:${PORT}:${PORT}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://nexus:${POSTGRES_PASSWORD}@postgres:5432/nexus
      PORT: ${PORT}
      NODE_ENV: production
      ALLOW_PRIVATE_URLS: ${ALLOW_PRIVATE_URLS}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # SMTP (Email Verification)
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      APP_URL: ${APP_URL}
      # Platform LLM API Keys (PLATFORM mode)
      PLATFORM_ANTHROPIC_API_KEY: ${PLATFORM_ANTHROPIC_API_KEY:-}
      PLATFORM_OPENAI_API_KEY: ${PLATFORM_OPENAI_API_KEY:-}
      PLATFORM_GOOGLE_API_KEY: ${PLATFORM_GOOGLE_API_KEY:-}
      PLATFORM_MISTRAL_API_KEY: ${PLATFORM_MISTRAL_API_KEY:-}
      PLATFORM_GROQ_API_KEY: ${PLATFORM_GROQ_API_KEY:-}
      PLATFORM_OPENROUTER_API_KEY: ${PLATFORM_OPENROUTER_API_KEY:-}
      # Default Gateway (auto-provisioned per org)
      DEFAULT_GATEWAY_URL: ${DEFAULT_GATEWAY_URL:-}
      DEFAULT_GATEWAY_TOKEN: ${DEFAULT_GATEWAY_TOKEN:-}
      DEFAULT_GATEWAY_WORKSPACE: ${DEFAULT_GATEWAY_WORKSPACE:-}
      # OpenTelemetry → SigNoz
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES}
      LOCAL_LLM_ENDPOINTS: ${LOCAL_LLM_ENDPOINTS}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL}
      LOCAL_LLM_REQUEST_TIMEOUT_MS: ${LOCAL_LLM_REQUEST_TIMEOUT_MS}
      GIT_WEBHOOK_SECRET: ${GIT_WEBHOOK_SECRET:-}
      AGENT_RUN_MODEL: ${AGENT_RUN_MODEL:-claude-3-7-sonnet}
      AGENT_RUN_TIMEOUT_MS: ${AGENT_RUN_TIMEOUT_MS:-900000}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_MODELS: ${GEMINI_MODELS:-gemini-2.5-flash,gemini-2.5-pro}
      GEMINI_API_BASE_URL: ${GEMINI_API_BASE_URL:-https://generativelanguage.googleapis.com}
      PROMPT_MODELS_JSON: ${PROMPT_MODELS_JSON:-}
      LLM_PROVIDER_MODEL_MAP_JSON: ${LLM_PROVIDER_MODEL_MAP_JSON:-}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-}
      OPENCODE_TIMEOUT_MS: ${OPENCODE_TIMEOUT_MS:-120000}
      OPENCODE_INSTALL_TIMEOUT_MS: ${OPENCODE_INSTALL_TIMEOUT_MS:-300000}
      DEFAULT_GITHUB_OWNER: ${DEFAULT_GITHUB_OWNER:-}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}


  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_SITE_URL: ${VITE_SITE_URL}
        VITE_DEFAULT_OG_IMAGE: ${VITE_DEFAULT_OG_IMAGE}
        VITE_LOCAL_LLM_ENDPOINT: ${VITE_LOCAL_LLM_ENDPOINT}
        VITE_LOCAL_LLM_MODEL: ${VITE_LOCAL_LLM_MODEL}
        VITE_LOCAL_LLM_MODELS_JSON: ${VITE_LOCAL_LLM_MODELS_JSON}
        VITE_GATEWAY_ENDPOINT: ${VITE_GATEWAY_ENDPOINT}
        VITE_MCP_PRESETS_JSON: ${VITE_MCP_PRESETS_JSON}
        VITE_DEV_PORT: ${VITE_DEV_PORT}
        VITE_BACKEND_URL: ${VITE_BACKEND_URL}
        VITE_DEFAULT_GITHUB_REPO: ${VITE_DEFAULT_GITHUB_REPO}
        VITE_DEFAULT_GITHUB_BRANCH: ${VITE_DEFAULT_GITHUB_BRANCH}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_BIND_HOST}:${FRONTEND_PORT}:80"

volumes:
  pgdata:
