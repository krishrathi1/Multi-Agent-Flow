services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus123}
      POSTGRES_DB: nexus
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://nexus:${POSTGRES_PASSWORD:-nexus123}@postgres:5432/nexus
      PORT: "4000"
      NODE_ENV: production
      ALLOW_PRIVATE_URLS: ${ALLOW_PRIVATE_URLS:-true}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://nexus.blostem.com,https://nexus.blostom.com}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # SMTP (Email Verification)
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM:-MyceliumOps <noreply@blostem.com>}
      APP_URL: ${APP_URL:-https://nexus.blostem.com}
      # Platform LLM API Keys (PLATFORM mode)
      PLATFORM_ANTHROPIC_API_KEY: ${PLATFORM_ANTHROPIC_API_KEY:-}
      PLATFORM_OPENAI_API_KEY: ${PLATFORM_OPENAI_API_KEY:-}
      PLATFORM_GOOGLE_API_KEY: ${PLATFORM_GOOGLE_API_KEY:-}
      PLATFORM_MISTRAL_API_KEY: ${PLATFORM_MISTRAL_API_KEY:-}
      PLATFORM_GROQ_API_KEY: ${PLATFORM_GROQ_API_KEY:-}
      PLATFORM_OPENROUTER_API_KEY: ${PLATFORM_OPENROUTER_API_KEY:-}
      # Default Gateway (auto-provisioned per org)
      DEFAULT_GATEWAY_URL: ${DEFAULT_GATEWAY_URL:-}
      DEFAULT_GATEWAY_TOKEN: ${DEFAULT_GATEWAY_TOKEN:-}
      DEFAULT_GATEWAY_WORKSPACE: ${DEFAULT_GATEWAY_WORKSPACE:-}
      # OpenTelemetry → SigNoz
      OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4318
      OTEL_SERVICE_NAME: myceliumops-backend
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=production

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:80"

volumes:
  pgdata:
