name: Automated PR Quality & Security Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  pr-review:
    name: Security & Quality Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Analyze PR Diff
        id: pr_diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          echo "diff_size=$(wc -l < pr_diff.txt)" >> $GITHUB_OUTPUT

      - name: Run Deterministic Security & Secret Scan
        id: sec_scan
        run: |
          # Check for known secret patterns in diff
          if grep -E "(AIzaSy[A-Za-z0-9_-]{33}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{82}|sk-ant-[A-Za-z0-9_-]{30,}|sk-[a-zA-Z0-9]{32,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)" pr_diff.txt; then
            echo "secrets_detected=true" >> $GITHUB_OUTPUT
          else
            echo "secrets_detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate PR Review Verification Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const diffSize = parseInt('${{ steps.pr_diff.outputs.diff_size }}', 10);
            const secretsDetected = '${{ steps.sec_scan.outputs.secrets_detected }}' === 'true';
            
            const commentBody = `### 🔍 Automated PR Quality & Security Summary
            
            **Scan Summary:** Analyzed **${diffSize}** changed lines across this pull request.
            
            | Inspection | Status | Result Detail |
            |---|---|---|
            | 🛡️ **Secret & Token Scan** | ${secretsDetected ? '❌ FAILED' : '✅ PASSED'} | ${secretsDetected ? 'Potential secret or API credential detected in diff.' : 'Zero credential or secret token patterns found in changed files.'} |
            | 📐 **Type Safety** | ℹ️ Enforced | Monitored by CI build step (\`tsc --noEmit\`). |
            | 🧪 **Test Suite** | ℹ️ Enforced | Monitored by CI build step (\`vitest run\` & \`backend tests\`). |
            
            *Automated CI quality gate.*`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });

      - name: Enforce Secret Gate
        if: steps.sec_scan.outputs.secrets_detected == 'true'
        run: |
          echo "::error::Credential leak detected in pull request diff! Failing CI security gate."
          exit 1

